<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malzemeler - Naciye</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>🍲 Naciye</h1>
  <div class="nav">
    <a href="ingredients.html" class="active">Malzemeler</a>
    <a href="recipes.html">Yemekler</a>
    <a href="calculate.html">Hesapla</a>
  </div>
  <button id="logoutBtn">Çıkış</button>
</div>

<div class="container">
  <div class="card">
    <h2>Yeni Malzeme Ekle</h2>
    <div id="msgBox"></div>
    <form id="addForm">
      <div class="form-row">
        <div>
          <label>Malzeme Adı</label>
          <input type="text" id="name" placeholder="Örn: Kıyma" required>
        </div>
        <div>
          <label>Birim</label>
          <select id="unit" required>
            <option value="kg">kg</option>
            <option value="adet">adet</option>
            <option value="lt">litre</option>
            <option value="gr">gram</option>
          </select>
        </div>
        <div>
          <label>Birim Fiyat (TL)</label>
          <input type="number" step="0.01" min="0" id="price" placeholder="Örn: 320" required>
        </div>
      </div>
      <button type="submit" class="btn">Ekle</button>
    </form>
  </div>

  <div class="card">
    <h2>Malzeme Listesi</h2>
    <table>
      <thead>
        <tr>
          <th>Ad</th>
          <th>Birim</th>
          <th>Fiyat</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="muted">Yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let editingId = null;

async function init() {
  const session = await requireAuth();
  if (!session) return;
  setupLogoutButton();
  await loadIngredients();
}

async function loadIngredients() {
  const tbody = document.getElementById("tableBody");
  const { data, error } = await supabaseClient
    .from("ingredients")
    .select("*")
    .order("name", { ascending: true });

  if (error) {
    tbody.innerHTML = `<tr><td colspan="4" class="msg error">Hata: ${error.message}</td></tr>`;
    return;
  }

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Henüz malzeme eklenmedi.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(ing => `
    <tr>
      <td>${ing.name}</td>
      <td>${ing.unit}</td>
      <td>${Number(ing.price).toFixed(2)} TL</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editIngredient('${ing.id}', '${ing.name.replace(/'/g, "\\'")}', '${ing.unit}', ${ing.price})">Düzenle</button>
        <button class="btn btn-sm btn-danger" onclick="deleteIngredient('${ing.id}')">Sil</button>
      </td>
    </tr>
  `).join("");
}

document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const unit = document.getElementById("unit").value;
  const price = parseFloat(document.getElementById("price").value);
  const msgBox = document.getElementById("msgBox");
  msgBox.innerHTML = "";

  let error;
  if (editingId) {
    ({ error } = await supabaseClient
      .from("ingredients")
      .update({ name, unit, price })
      .eq("id", editingId));
  } else {
    ({ error } = await supabaseClient
      .from("ingredients")
      .insert({ name, unit, price }));
  }

  if (error) {
    msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg success">${editingId ? "Güncellendi" : "Eklendi"}.</div>`;
  document.getElementById("addForm").reset();
  editingId = null;
  await loadIngredients();
});

function editIngredient(id, name, unit, price) {
  editingId = id;
  document.getElementById("name").value = name;
  document.getElementById("unit").value = unit;
  document.getElementById("price").value = price;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteIngredient(id) {
  if (!confirm("Bu malzemeyi silmek istediğine emin misin? (Bir yemekte kullanılıyorsa hata alabilirsin.)")) return;
  const { error } = await supabaseClient.from("ingredients").delete().eq("id", id);
  if (error) {
    alert("Hata: " + error.message);
    return;
  }
  await loadIngredients();
}

init();
</script>

</body>
</html>
