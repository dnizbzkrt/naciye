<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naciye Ev Yemekleri - Giriş</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>🍲 Naciye</h1>
    <p class="sub">Yemek maliyet takip sistemi</p>

    <div id="msgBox"></div>

    <form id="loginForm">
      <div class="form-row">
        <div>
          <label>E-posta</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Şifre</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn" style="width:100%">Giriş Yap</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
redirectIfLoggedIn();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msgBox = document.getElementById("msgBox");
  msgBox.innerHTML = "";

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msgBox.innerHTML = `<div class="msg error">Giriş başarısız: ${error.message}</div>`;
  } else {
    window.location.href = "home.html";
  }
});
</script>

</body>
</html>
