<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Tablo - Naciye</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>🍲 Naciye</h1>
  <div class="nav">
    <a href="home.html">Hesapla</a>
    <a href="admin.html" class="active">Master Tablo</a>
  </div>
  <button id="logoutBtn">Çıkış</button>
</div>

<div class="container">
  <p class="muted" style="margin-bottom: 16px;">
    Burada varsayılan yemek, malzeme ve fiyat listesini görüp değiştirebilirsin.
    Hiçbir şeyi değiştirmezsen varsayılan değerler kullanılmaya devam eder.
  </p>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabIngBtn" onclick="showTab('ing')">Malzemeler</button>
    <button class="tab-btn" id="tabRecBtn" onclick="showTab('rec')">Yemekler</button>
  </div>

  <!-- MALZEMELER -->
  <div class="tab-panel active" id="tabIng">
    <div class="card">
      <h2 id="ingFormTitle">Yeni Malzeme Ekle</h2>
      <div id="ingMsgBox"></div>
      <form id="ingForm">
        <div class="form-row">
          <div>
            <label>Malzeme Adı</label>
            <input type="text" id="ingName" placeholder="Örn: Kıyma" required>
          </div>
          <div>
            <label>Birim</label>
            <select id="ingUnit" required>
              <option value="kg">kg</option>
              <option value="adet">adet</option>
              <option value="lt">litre</option>
              <option value="gr">gram</option>
            </select>
          </div>
          <div>
            <label>Birim Fiyat (TL)</label>
            <input type="number" step="0.01" min="0" id="ingPrice" placeholder="Örn: 320" required>
          </div>
        </div>
        <button type="submit" class="btn" id="ingSubmitBtn">Ekle</button>
        <button type="button" class="btn btn-outline" id="ingCancelBtn" style="display:none" onclick="resetIngredientForm()">İptal</button>
      </form>
    </div>

    <div class="card">
      <h2>Malzeme Listesi</h2>
      <table>
        <thead>
          <tr><th>Ad</th><th>Birim</th><th>Fiyat</th><th></th></tr>
        </thead>
        <tbody id="ingTableBody">
          <tr><td colspan="4" class="muted">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- YEMEKLER -->
  <div class="tab-panel" id="tabRec">
    <div class="card">
      <h2 id="recFormTitle">Yeni Yemek Ekle</h2>
      <div id="recMsgBox"></div>
      <div class="form-row">
        <div>
          <label>Yemek Adı</label>
          <input type="text" id="recipeName" placeholder="Örn: Mantı">
        </div>
      </div>

      <label>Malzemeler (standart tarif - referans amaçlı)</label>
      <div id="ingredientRows"></div>
      <button type="button" class="btn btn-outline btn-sm" onclick="addIngredientRow()">+ Malzeme Ekle</button>

      <div style="margin-top:16px">
        <button type="button" class="btn" onclick="saveRecipe()">Kaydet</button>
        <button type="button" class="btn btn-outline" id="recCancelBtn" style="display:none" onclick="resetRecipeForm()">İptal</button>
      </div>
    </div>

    <div class="card">
      <h2>Yemek Listesi</h2>
      <div id="recipeList" class="muted">Yükleniyor...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let allIngredients = [];
let editingIngredientId = null;
let editingRecipeId = null;

async function init() {
  const session = await requireAuth();
  if (!session) return;
  setupLogoutButton();
  await loadIngredients();
  addIngredientRow();
  await loadRecipes();
}

function showTab(tab) {
  document.getElementById("tabIng").classList.toggle("active", tab === "ing");
  document.getElementById("tabRec").classList.toggle("active", tab === "rec");
  document.getElementById("tabIngBtn").classList.toggle("active", tab === "ing");
  document.getElementById("tabRecBtn").classList.toggle("active", tab === "rec");
}

/* ---------- MALZEMELER ---------- */

async function loadIngredients() {
  const tbody = document.getElementById("ingTableBody");
  const { data, error } = await supabaseClient.from("ingredients").select("*").order("name");
  if (error) {
    tbody.innerHTML = `<tr><td colspan="4" class="msg error">Hata: ${error.message}</td></tr>`;
    return;
  }
  allIngredients = data || [];
  if (!allIngredients.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Henüz malzeme eklenmedi.</td></tr>`;
    return;
  }
  tbody.innerHTML = allIngredients.map(ing => `
    <tr>
      <td>${ing.name}</td>
      <td>${ing.unit}</td>
      <td>${Number(ing.price).toFixed(2)} TL</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editIngredient('${ing.id}')">Düzenle</button>
        <button class="btn btn-sm btn-danger" onclick="deleteIngredient('${ing.id}')">Sil</button>
      </td>
    </tr>
  `).join("");
}

document.getElementById("ingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("ingName").value.trim();
  const unit = document.getElementById("ingUnit").value;
  const price = parseFloat(document.getElementById("ingPrice").value);
  const msgBox = document.getElementById("ingMsgBox");
  msgBox.innerHTML = "";

  let error;
  if (editingIngredientId) {
    ({ error } = await supabaseClient.from("ingredients").update({ name, unit, price }).eq("id", editingIngredientId));
  } else {
    ({ error } = await supabaseClient.from("ingredients").insert({ name, unit, price }));
  }

  if (error) {
    msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`;
    return;
  }

  msgBox.innerHTML = `<div class="msg success">${editingIngredientId ? "Güncellendi" : "Eklendi"}.</div>`;
  resetIngredientForm();
  await loadIngredients();
});

function editIngredient(id) {
  const ing = allIngredients.find(i => i.id === id);
  if (!ing) return;
  editingIngredientId = id;
  document.getElementById("ingName").value = ing.name;
  document.getElementById("ingUnit").value = ing.unit;
  document.getElementById("ingPrice").value = ing.price;
  document.getElementById("ingFormTitle").textContent = "Malzemeyi Düzenle: " + ing.name;
  document.getElementById("ingSubmitBtn").textContent = "Güncelle";
  document.getElementById("ingCancelBtn").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetIngredientForm() {
  editingIngredientId = null;
  document.getElementById("ingForm").reset();
  document.getElementById("ingFormTitle").textContent = "Yeni Malzeme Ekle";
  document.getElementById("ingSubmitBtn").textContent = "Ekle";
  document.getElementById("ingCancelBtn").style.display = "none";
}

async function deleteIngredient(id) {
  if (!confirm("Bu malzemeyi silmek istediğine emin misin? (Bir yemekte kullanılıyorsa hata alabilirsin.)")) return;
  const { error } = await supabaseClient.from("ingredients").delete().eq("id", id);
  if (error) { alert("Hata: " + error.message); return; }
  await loadIngredients();
}

/* ---------- YEMEKLER ---------- */

function ingredientOptions(selectedId) {
  return allIngredients.map(ing =>
    `<option value="${ing.id}" ${ing.id === selectedId ? "selected" : ""}>${ing.name} (${ing.unit})</option>`
  ).join("");
}

function addIngredientRow(ingredientId = "", qty = "") {
  const wrap = document.getElementById("ingredientRows");
  const row = document.createElement("div");
  row.className = "form-row ingredient-row";
  row.innerHTML = `
    <div>
      <select class="ing-select">${ingredientOptions(ingredientId)}</select>
    </div>
    <div style="max-width:140px">
      <input type="number" step="0.01" min="0" class="ing-qty" placeholder="Miktar" value="${qty}">
    </div>
    <div style="max-width:60px; display:flex; align-items:flex-end;">
      <span class="remove-link" onclick="this.closest('.ingredient-row').remove()">Sil</span>
    </div>
  `;
  wrap.appendChild(row);
}

async function saveRecipe() {
  const msgBox = document.getElementById("recMsgBox");
  msgBox.innerHTML = "";
  const name = document.getElementById("recipeName").value.trim();
  if (!name) { msgBox.innerHTML = `<div class="msg error">Yemek adı gerekli.</div>`; return; }

  const rows = document.querySelectorAll(".ingredient-row");
  const items = [];
  rows.forEach(row => {
    const ingId = row.querySelector(".ing-select").value;
    const qty = parseFloat(row.querySelector(".ing-qty").value);
    if (ingId && qty > 0) items.push({ ingredient_id: ingId, quantity: qty });
  });

  if (!items.length) { msgBox.innerHTML = `<div class="msg error">En az bir malzeme ekle.</div>`; return; }

  let recipeId = editingRecipeId;

  if (recipeId) {
    const { error } = await supabaseClient.from("recipes").update({ name }).eq("id", recipeId);
    if (error) { msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }
    await supabaseClient.from("recipe_ingredients").delete().eq("recipe_id", recipeId);
  } else {
    const { data, error } = await supabaseClient.from("recipes").insert({ name }).select().single();
    if (error) { msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }
    recipeId = data.id;
  }

  const rowsToInsert = items.map(it => ({ recipe_id: recipeId, ingredient_id: it.ingredient_id, quantity: it.quantity }));
  const { error: riError } = await supabaseClient.from("recipe_ingredients").insert(rowsToInsert);
  if (riError) { msgBox.innerHTML = `<div class="msg error">Hata: ${riError.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg success">${editingRecipeId ? "Güncellendi" : "Eklendi"}.</div>`;
  resetRecipeForm();
  await loadRecipes();
}

function resetRecipeForm() {
  editingRecipeId = null;
  document.getElementById("recipeName").value = "";
  document.getElementById("ingredientRows").innerHTML = "";
  addIngredientRow();
  document.getElementById("recFormTitle").textContent = "Yeni Yemek Ekle";
  document.getElementById("recCancelBtn").style.display = "none";
}

async function loadRecipes() {
  const listEl = document.getElementById("recipeList");
  const { data: recipes, error } = await supabaseClient.from("recipes").select("*").order("name");
  if (error) { listEl.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }

  if (!recipes.length) { listEl.innerHTML = `<div class="muted">Henüz yemek eklenmedi.</div>`; return; }

  const { data: allRi } = await supabaseClient.from("recipe_ingredients").select("*, ingredients(name, unit)");

  listEl.innerHTML = recipes.map(r => {
    const items = (allRi || []).filter(ri => ri.recipe_id === r.id);
    const itemsHtml = items.map(it =>
      `<li>${it.ingredients?.name || "?"}: ${it.quantity} ${it.ingredients?.unit || ""}</li>`
    ).join("");
    return `
      <div class="card" style="background:#fdfaf7">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${r.name}</strong>
          <div>
            <button class="btn btn-sm btn-outline" onclick="editRecipe('${r.id}')">Düzenle</button>
            <button class="btn btn-sm btn-danger" onclick="deleteRecipe('${r.id}')">Sil</button>
          </div>
        </div>
        <ul>${itemsHtml || '<li class="muted">Malzeme eklenmemiş</li>'}</ul>
      </div>
    `;
  }).join("");
}

async function editRecipe(id) {
  const { data: recipe } = await supabaseClient.from("recipes").select("*").eq("id", id).single();
  const { data: items } = await supabaseClient.from("recipe_ingredients").select("*").eq("recipe_id", id);

  editingRecipeId = id;
  document.getElementById("recipeName").value = recipe.name;
  document.getElementById("ingredientRows").innerHTML = "";
  items.forEach(it => addIngredientRow(it.ingredient_id, it.quantity));
  if (!items.length) addIngredientRow();

  document.getElementById("recFormTitle").textContent = "Yemeği Düzenle: " + recipe.name;
  document.getElementById("recCancelBtn").style.display = "inline-block";
  showTab("rec");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteRecipe(id) {
  if (!confirm("Bu yemeği silmek istediğine emin misin?")) return;
  await supabaseClient.from("recipe_ingredients").delete().eq("recipe_id", id);
  const { error } = await supabaseClient.from("recipes").delete().eq("id", id);
  if (error) { alert("Hata: " + error.message); return; }
  await loadRecipes();
}

init();
</script>

</body>
</html>
