<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yemekler - Naciye</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>🍲 Naciye</h1>
  <div class="nav">
    <a href="ingredients.html">Malzemeler</a>
    <a href="recipes.html" class="active">Yemekler</a>
    <a href="calculate.html">Hesapla</a>
  </div>
  <button id="logoutBtn">Çıkış</button>
</div>

<div class="container">
  <div class="card">
    <h2 id="formTitle">Yeni Yemek Ekle</h2>
    <div id="msgBox"></div>
    <div class="form-row">
      <div>
        <label>Yemek Adı</label>
        <input type="text" id="recipeName" placeholder="Örn: Mantı">
      </div>
    </div>

    <label>Malzemeler (bu yemeğin standart tarifi - referans amaçlı)</label>
    <div id="ingredientRows"></div>
    <button type="button" class="btn btn-outline btn-sm" onclick="addIngredientRow()">+ Malzeme Ekle</button>

    <div style="margin-top:16px">
      <button type="button" class="btn" onclick="saveRecipe()">Kaydet</button>
      <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none" onclick="resetForm()">İptal</button>
    </div>
  </div>

  <div class="card">
    <h2>Yemek Listesi</h2>
    <div id="recipeList" class="muted">Yükleniyor...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let allIngredients = [];
let editingRecipeId = null;

async function init() {
  const session = await requireAuth();
  if (!session) return;
  setupLogoutButton();
  await loadIngredientsList();
  addIngredientRow();
  await loadRecipes();
}

async function loadIngredientsList() {
  const { data, error } = await supabaseClient.from("ingredients").select("*").order("name");
  if (error) { console.error(error); return; }
  allIngredients = data;
}

function ingredientOptions(selectedId) {
  return allIngredients.map(ing =>
    `<option value="${ing.id}" ${ing.id === selectedId ? "selected" : ""}>${ing.name} (${ing.unit})</option>`
  ).join("");
}

function addIngredientRow(ingredientId = "", qty = "") {
  const wrap = document.getElementById("ingredientRows");
  const row = document.createElement("div");
  row.className = "form-row ingredient-row";
  row.innerHTML = `
    <div>
      <select class="ing-select">${ingredientOptions(ingredientId)}</select>
    </div>
    <div style="max-width:140px">
      <input type="number" step="0.01" min="0" class="ing-qty" placeholder="Miktar" value="${qty}">
    </div>
    <div style="max-width:60px; display:flex; align-items:flex-end;">
      <span class="remove-link" onclick="this.closest('.ingredient-row').remove()">Sil</span>
    </div>
  `;
  wrap.appendChild(row);
}

async function saveRecipe() {
  const msgBox = document.getElementById("msgBox");
  msgBox.innerHTML = "";
  const name = document.getElementById("recipeName").value.trim();
  if (!name) { msgBox.innerHTML = `<div class="msg error">Yemek adı gerekli.</div>`; return; }

  const rows = document.querySelectorAll(".ingredient-row");
  const items = [];
  rows.forEach(row => {
    const ingId = row.querySelector(".ing-select").value;
    const qty = parseFloat(row.querySelector(".ing-qty").value);
    if (ingId && qty > 0) items.push({ ingredient_id: ingId, quantity: qty });
  });

  if (!items.length) { msgBox.innerHTML = `<div class="msg error">En az bir malzeme ekle.</div>`; return; }

  let recipeId = editingRecipeId;

  if (recipeId) {
    const { error } = await supabaseClient.from("recipes").update({ name }).eq("id", recipeId);
    if (error) { msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }
    await supabaseClient.from("recipe_ingredients").delete().eq("recipe_id", recipeId);
  } else {
    const { data, error } = await supabaseClient.from("recipes").insert({ name }).select().single();
    if (error) { msgBox.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }
    recipeId = data.id;
  }

  const rowsToInsert = items.map(it => ({ recipe_id: recipeId, ingredient_id: it.ingredient_id, quantity: it.quantity }));
  const { error: riError } = await supabaseClient.from("recipe_ingredients").insert(rowsToInsert);
  if (riError) { msgBox.innerHTML = `<div class="msg error">Hata: ${riError.message}</div>`; return; }

  msgBox.innerHTML = `<div class="msg success">${editingRecipeId ? "Güncellendi" : "Eklendi"}.</div>`;
  resetForm();
  await loadRecipes();
}

function resetForm() {
  editingRecipeId = null;
  document.getElementById("recipeName").value = "";
  document.getElementById("ingredientRows").innerHTML = "";
  addIngredientRow();
  document.getElementById("formTitle").textContent = "Yeni Yemek Ekle";
  document.getElementById("cancelEditBtn").style.display = "none";
}

async function loadRecipes() {
  const listEl = document.getElementById("recipeList");
  const { data: recipes, error } = await supabaseClient.from("recipes").select("*").order("name");
  if (error) { listEl.innerHTML = `<div class="msg error">Hata: ${error.message}</div>`; return; }

  if (!recipes.length) { listEl.innerHTML = `<div class="muted">Henüz yemek eklenmedi.</div>`; return; }

  const { data: allRi } = await supabaseClient
    .from("recipe_ingredients")
    .select("*, ingredients(name, unit)");

  listEl.innerHTML = recipes.map(r => {
    const items = (allRi || []).filter(ri => ri.recipe_id === r.id);
    const itemsHtml = items.map(it =>
      `<li>${it.ingredients?.name || "?"}: ${it.quantity} ${it.ingredients?.unit || ""}</li>`
    ).join("");
    return `
      <div class="card" style="background:#fdfaf7">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${r.name}</strong>
          <div>
            <button class="btn btn-sm btn-outline" onclick='editRecipe(${JSON.stringify(r.id)})'>Düzenle</button>
            <button class="btn btn-sm btn-danger" onclick="deleteRecipe('${r.id}')">Sil</button>
          </div>
        </div>
        <ul>${itemsHtml || '<li class="muted">Malzeme eklenmemiş</li>'}</ul>
      </div>
    `;
  }).join("");
}

async function editRecipe(id) {
  const { data: recipe } = await supabaseClient.from("recipes").select("*").eq("id", id).single();
  const { data: items } = await supabaseClient.from("recipe_ingredients").select("*").eq("recipe_id", id);

  editingRecipeId = id;
  document.getElementById("recipeName").value = recipe.name;
  document.getElementById("ingredientRows").innerHTML = "";
  items.forEach(it => addIngredientRow(it.ingredient_id, it.quantity));
  if (!items.length) addIngredientRow();

  document.getElementById("formTitle").textContent = "Yemeği Düzenle: " + recipe.name;
  document.getElementById("cancelEditBtn").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteRecipe(id) {
  if (!confirm("Bu yemeği silmek istediğine emin misin?")) return;
  await supabaseClient.from("recipe_ingredients").delete().eq("recipe_id", id);
  const { error } = await supabaseClient.from("recipes").delete().eq("id", id);
  if (error) { alert("Hata: " + error.message); return; }
  await loadRecipes();
}

init();
</script>

</body>
</html>
